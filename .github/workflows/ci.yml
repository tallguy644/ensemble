name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test -count=1 ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build Windows programs
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w -H=windowsgui -X main.guiBuild=1 -X main.version=${GITHUB_REF_NAME#v}" -o dist/$arch/Ensemble.exe .
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o dist/$arch/ensemble-cli.exe .
            (cd dist/$arch && zip -q ../Ensemble-windows-$arch.zip Ensemble.exe ensemble-cli.exe)
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
