name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Resolve modules
        run: go mod tidy
      - name: Save updated go.mod/go.sum to the branch
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git diff --quiet go.mod go.sum; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "Update go.mod and go.sum"
            git push
          fi
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Build Windows programs
        if: matrix.os == 'ubuntu-latest'
        env:
          GOOS: windows
        run: |
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.guiBuild=1" -o dist/Ensemble.exe .
          go build -trimpath -ldflags "-s -w" -o dist/ensemble-cli.exe .
          ls -la dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build Windows programs
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w -H=windowsgui -X main.guiBuild=1 -X main.version=${GITHUB_REF_NAME#v}" -o dist/$arch/Ensemble.exe .
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o dist/$arch/ensemble-cli.exe .
            (cd dist/$arch && zip -q ../Ensemble-windows-$arch.zip Ensemble.exe ensemble-cli.exe)
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
